# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Dayu k30 Dongle"

# Dongle插USB，不需要省电，关闭空闲超时
CONFIG_ZMK_IDLE_TIMEOUT=0

# 启用 NKRO（全键无冲）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# 配置蓝牙控制器的发射功率
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 注意：BT_MAX_CONN 和 BT_MAX_PAIRED 在 Kconfig.defconfig 中设置

# 启用OLED显示
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y

# 关键：使用专用工作队列，防止LVGL栈溢出
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# 增大主线程和系统工作队列栈
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# USB日志功能配置
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384

# 日志配置（去掉IMMEDIATE，防止ISR日志崩溃）
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MAX_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# I2C调试日志（降低到WARNING，避免ISR中DBG日志崩溃）
CONFIG_I2C_LOG_LEVEL_INF=y
