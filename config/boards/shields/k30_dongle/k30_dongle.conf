# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Dayu k30 Dongle"

# Dongle插USB，不需要省电，关闭空闲超时
CONFIG_ZMK_IDLE_TIMEOUT=0

# 启用 NKRO（全键无冲）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# 配置蓝牙控制器的发射功率
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 注意：BT_MAX_CONN 和 BT_MAX_PAIRED 在 Kconfig.defconfig 中设置

# === OLED 显示配置 ===
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# I2C 配置
CONFIG_I2C=y

# SSD1306 驱动
CONFIG_SSD1306=y

# LVGL 配置
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_COLOR_DEPTH=1
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# 栈大小
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 从键盘获取电量
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# USB日志功能配置（用于调试I2C/OLED通信）
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384

# 日志配置
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MAX_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# I2C调试日志
CONFIG_I2C_LOG_LEVEL_DBG=y
