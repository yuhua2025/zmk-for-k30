CONFIG_ZMK_KEYBOARD_NAME="Dayu k30 Dongle"
CONFIG_ZMK_IDLE_TIMEOUT=0
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split 连接参数（dongle 作为 central 发起）
# 监督超时从默认 400 (4s) 提高到 1000 (10s)：2.4G 短时干扰不再立刻判定掉线，
# 减少"用着用着断联"的假掉线。延迟参数保持 ZMK 默认（interval 6 / latency 30）。
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1000
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MAX_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_I2C_LOG_LEVEL_DBG=y
