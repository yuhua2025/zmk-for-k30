# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Dayu k30"

# 配置 ZMK 键盘固件的空闲超时时间
# 当键盘在 120000 毫秒（即 2 分钟）内没有任何用户操作时，系统将进入空闲状态
CONFIG_ZMK_IDLE_TIMEOUT=120000

# 启用 ZMK 键盘固件的睡眠功能
CONFIG_ZMK_SLEEP=y

# 配置 ZMK 键盘固件在空闲状态下进入睡眠的超时时间
# 当键盘处于空闲状态 600000 毫秒（即 10 分钟）后，将进入睡眠模式
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# 启用 NKRO（全键无冲）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# 配置蓝牙控制器的发射功率
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 可用蓝牙配置文件的数量
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# LED和状态指示配置
# 启用ZMK的背光功能
CONFIG_ZMK_BACKLIGHT=y
# 亮度步进值（百分比）
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
# 启动时默认亮度
CONFIG_ZMK_BACKLIGHT_BRT_START=20
# 启动时默认开启背光
CONFIG_ZMK_BACKLIGHT_ON_START=y
# 空闲时自动关闭背光（按键后自动亮起）
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
# 关闭"USB断开时灭背光"（电池供电时也要亮）
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB is not set

# 电池电量上报（让 Dongle OLED 能显示电量）
CONFIG_ZMK_BATTERY=y
