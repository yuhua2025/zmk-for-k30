name: Build K30 Keyboard - Full Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
      options: --user root

    steps:
      - name: Checkout your repo (to get your k30 config)
        uses: actions/checkout@v4

      - name: Clone and set up official ZMK (v0.3.0)
        run: |
          git clone --branch v0.3.0 --depth 1 https://github.com/zmkfirmware/zmk.git
          cd zmk
          west init -l app
          west update
          west zephyr-export
          mkdir -p app/boards/shields/k30
          cp -r "$GITHUB_WORKSPACE/config/boards/shields/k30"/* app/boards/shields/k30/
          mkdir -p app/boards/shields/k30_dongle
          cp -r "$GITHUB_WORKSPACE/config/boards/shields/k30_dongle"/* app/boards/shields/k30_dongle/

      - name: Modify board pinctrl for I2C (P0.20 + pull-up)
        working-directory: zmk
        run: |
          sed -i 's/TWIM_SDA, 0, 15/TWIM_SDA, 0, 20/g' app/boards/arm/nrfmicro/nrfmicro-pinctrl.dtsi
          sed -i '/TWIM_SCL, 0, 17;/a \t\t\tbias-pull-up;' app/boards/arm/nrfmicro/nrfmicro-pinctrl.dtsi

      - name: Patch Kconfig.defconfig for mono OLED display
        working-directory: zmk
        run: |
          KCONF=app/boards/shields/k30_dongle/Kconfig.defconfig
          printf '\nif SHIELD_K30_DONGLE\n\nif ZMK_DISPLAY\n\nconfig I2C\n\tdefault y\n\nconfig SSD1306\n\tdefault y\n\nconfig LV_USE_LABEL\n\tdefault y\n\nconfig LV_Z_MEM_POOL_SIZE\n\tdefault 8192\n\nendif # ZMK_DISPLAY\n\nif LVGL\n\nconfig LV_Z_VDB_SIZE\n\tdefault 64\n\nconfig LV_DPI_DEF\n\tdefault 148\n\nconfig LV_Z_BITS_PER_PIXEL\n\tdefault 1\n\nchoice LV_COLOR_DEPTH\n\tdefault LV_COLOR_DEPTH_1\nendchoice\n\nconfig LV_FONT_MONTSERRAT_12\n\tdefault y\n\nconfig LV_FONT_MONTSERRAT_16\n\tdefault y\n\nendif # LVGL\n\nendif # SHIELD_K30_DONGLE\n' >> "$KCONF"
          echo "=== Patched Kconfig.defconfig ==="
          cat "$KCONF"

      - name: Patch k30.conf - enable battery reporting
        working-directory: zmk
        run: |
          echo "CONFIG_ZMK_BATTERY_REPORTING=y" >> app/boards/shields/k30/k30.conf
          echo "=== Patched k30.conf ==="
          cat app/boards/shields/k30/k30.conf

      - name: Patch k30_dongle.conf with display and battery fixes
        working-directory: zmk
        run: |
          CONF=app/boards/shields/k30_dongle/k30_dongle.conf
          printf '\n# Display - custom status screen with peripheral battery\nCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y\nCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y\nCONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y\nCONFIG_MAIN_STACK_SIZE=2048\nCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048\nCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y\nCONFIG_ZMK_IDLE_TIMEOUT=15000\n' >> "$CONF"
          echo "=== Patched conf ==="
          cat $CONF

      - name: Build k30 peripheral firmware
        working-directory: zmk
        run: |
          west build -b nrfmicro_13 -s app -d build_k30 -- -DSHIELD=k30 -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

      - name: Build k30 dongle firmware (with USB logging)
        working-directory: zmk
        run: |
          west build -b nrfmicro_13 -s app -d build_dongle -- -DSHIELD=k30_dongle -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

      - name: Upload k30 peripheral firmware
        uses: actions/upload-artifact@v4
        with:
          name: k30-peripheral-firmware
          path: zmk/build_k30/zephyr/zmk.uf2

      - name: Upload k30 dongle firmware
        uses: actions/upload-artifact@v4
        with:
          name: k30-dongle-firmware
          path: zmk/build_dongle/zephyr/zmk.uf2
